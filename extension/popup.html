<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vocalm</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="icons/icon-128.png" width="34" height="34" alt="" />
        <div>
          <h1>Vocalm</h1>
          <span>Nghe trọn. Hiểu sâu.</span>
        </div>
      </div>
      <button
        id="settings"
        class="icon-button"
        aria-label="Cài đặt"
        title="Cài đặt"
      >
        <svg viewBox="0 0 24 24">
          <path d="M4 7h16M4 17h16" />
          <circle cx="9" cy="7" r="3" />
          <circle cx="15" cy="17" r="3" />
        </svg>
      </button>
    </header>
    <main id="home">
      <section class="now-playing">
        <span class="eyebrow">VIDEO HIỆN TẠI</span>
        <h2 id="video-title">Mở một video để bắt đầu</h2>
        <div class="connection">
          <span id="connection-dot"></span
          ><span id="connection-text">Đang kết nối…</span>
        </div>
      </section>
      <div id="status" role="status" aria-live="polite">
        Mọi điều khiển, ngay tại đây.
      </div>
      <section class="card" id="listen-view">
        <div class="section-heading">
          <h3>Giọng đọc & phụ đề</h3>
          <span class="pill">Một giọng</span>
        </div>
        <label class="field" for="voice"
          >Giọng đọc<select id="voice"></select
        ></label>
        <div class="two-columns">
          <label class="field" for="language"
            >Dịch sang<select id="language">
              <option value="vi">Tiếng Việt</option>
              <option value="en">English</option>
              <option value="ja">日本語</option>
              <option value="ko">한국어</option>
              <option value="zh">中文</option>
              <option value="fr">Français</option>
              <option value="de">Deutsch</option>
              <option value="es">Español</option>
            </select></label
          ><label class="field" for="mode"
            >Hiển thị<select id="mode">
              <option value="bilingual">Song ngữ</option>
              <option value="translated">Bản dịch</option>
              <option value="original">Bản gốc</option>
              <option value="off">Ẩn phụ đề</option>
            </select></label
          >
        </div>
        <details class="advanced">
          <summary>Tùy chọn dịch</summary>
          <label class="field"
            >Mô hình<select id="model">
              <option value="basic">Gemini · Cơ bản</option>
              <option value="advanced">Gemini · Nâng cao</option>
              <option value="deepseek">DeepSeek</option>
            </select></label
          ><label class="field"
            >Video không có phụ đề<select id="asr">
              <option value="fast">Nhanh · Deepgram</option>
              <option value="quality">Chất lượng · Qwen ASR</option>
            </select></label
          >
          <div class="import-row">
            <label class="file-button"
              ><svg viewBox="0 0 24 24">
                <path d="M12 16V4m-4 4 4-4 4 4M5 15v5h14v-5" /></svg
              ><span id="file-name">Nhập phụ đề .srt</span
              ><input id="srt" type="file" accept=".srt" /></label
            ><label class="check"
              ><input id="translated" type="checkbox" />Đã dịch</label
            >
          </div>
        </details>
        <div class="play-actions">
          <button id="start" class="primary">
            <svg viewBox="0 0 24 24"><path d="m9 5 10 7-10 7Z" /></svg
            ><span>Bắt đầu lồng tiếng</span></button
          ><button
            id="stop"
            class="stop"
            aria-label="Dừng lồng tiếng"
            title="Dừng"
            disabled
          >
            <svg viewBox="0 0 24 24">
              <rect x="7" y="7" width="10" height="10" rx="2" />
            </svg>
          </button>
        </div>
        <button id="use-asr" class="fallback-action" hidden>
          Dùng ASR cho video này
        </button>
      </section>
      <section class="card mixer" id="sound-view" hidden>
        <div class="section-heading">
          <h3>Âm thanh</h3>
          <span class="caption">Theo cách bạn nghe</span>
        </div>
        <label class="slider-label" for="original"
          ><span>Video gốc</span><output id="original-value">20%</output></label
        ><input id="original" type="range" min="0" max="100" value="20" /><label
          class="slider-label"
          for="dub"
          ><span>Giọng lồng tiếng</span
          ><output id="dub-value">100%</output></label
        ><input id="dub" type="range" min="0" max="100" value="100" />
        <details class="advanced">
          <summary>Nhạc nền</summary>
          <select id="bgm" aria-label="Nhạc nền">
            <option value="">Tắt</option></select
          ><label class="slider-label" for="music"
            ><span>Âm lượng nhạc</span
            ><output id="music-value">12%</output></label
          ><input id="music" type="range" min="0" max="100" value="12" />
        </details>
      </section>
      <nav class="study-actions" aria-label="Học cùng video">
        <button data-section="transcript">
          <svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9" /></svg>Phụ
          đề</button
        ><button data-section="summary">
          <svg viewBox="0 0 24 24">
            <path d="M8 5h11M8 12h11M8 19h7M3 5h.01M3 12h.01M3 19h.01" /></svg
          >Tóm tắt</button
        ><button data-section="chat">
          <svg viewBox="0 0 24 24">
            <path
              d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 3v-3H3V6a2 2 0 0 1 2-2Z"
            /></svg
          >Hỏi AI
        </button>
      </nav>
      <footer>
        <span id="ready-label">Dành cho khoảnh khắc bạn muốn hiểu hơn.</span>
      </footer>
    </main>
    <section id="preferences" hidden aria-label="Cài đặt">
      <div class="preferences-header">
        <button id="back" class="icon-button" aria-label="Quay lại">
          <svg viewBox="0 0 24 24"><path d="m14 5-7 7 7 7" /></svg>
        </button>
        <h2>Cài đặt</h2>
        <span>Lưu trên thiết bị này</span>
      </div>
      <iframe id="settings-frame" title="Cài đặt Vocalm"></iframe>
    </section>
    <nav class="bottom-nav" aria-label="Vocalm">
      <button data-view="listen" aria-pressed="true">
        <svg viewBox="0 0 24 24">
          <path d="M4 14v-3a8 8 0 0 1 16 0v3M4 12h3v8H4zM17 12h3v8h-3z" /></svg
        >Nghe</button
      ><button data-view="sound" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M5 9v6m5-11v16m5-12v8m5-5v2" /></svg
        >Âm thanh</button
      ><button data-view="account" aria-pressed="false">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 21a8 8 0 0 1 16 0" /></svg
        >Kết nối
      </button>
    </nav>
    <script src="lib/core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
