[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "auvirel"
version = "0.1.0"
description = "Private subtitle translation and single-voice dubbing services"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1",
  "cryptography>=44", "psutil>=6", "python-multipart>=0.0.20",
  "modal==1.6.3", "pydantic-settings>=2.7,<3", "pypinyin==0.55.0"
]

[project.optional-dependencies]
test = ["pytest>=8", "requests>=2.32", "json5>=0.10", "beautifulsoup4>=4.12", "jsbeautifier>=1.15"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["admin/*.html", "admin/*.css", "admin/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
